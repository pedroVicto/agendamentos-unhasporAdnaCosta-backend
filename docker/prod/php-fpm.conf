[www]
; CRÍTICO: por padrão o php-fpm limpa o ambiente antes de rodar os workers,
; e getenv('DB_HOST') devolveria false mesmo com a variável definida no
; container. Sem isso a aplicação sobe e quebra na primeira query.
clear_env = no

; Erros do PHP (inclusive os error_log() do index.php) vão para o stderr
; do container em vez de morrer num arquivo dentro da imagem.
catch_workers_output = yes
decorate_workers_output = no

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
