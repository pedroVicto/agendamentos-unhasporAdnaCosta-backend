[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

; Dois processos num container: o nginx atende a porta pública e repassa
; os .php para o php-fpm no loopback.
[program:php-fpm]
command = php-fpm --nodaemonize --force-stderr
autorestart = true
startretries = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
priority = 10

[program:nginx]
command = nginx -g "daemon off;"
autorestart = true
startretries = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
priority = 20
