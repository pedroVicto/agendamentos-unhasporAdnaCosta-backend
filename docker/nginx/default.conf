server {
    listen 80;
    server_name localhost;

    # Raiz do site: como o seu index.php está na raiz do projeto
    # (não dentro de uma pasta "public/"), a raiz aponta para o
    # próprio diretório do código dentro do container.
    root /var/www/html;
    index index.php index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location / {
        # Fallback: qualquer rota que não seja um arquivo real
        # cai no index.php (necessário para rotas amigáveis).
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Bloqueia acesso direto a arquivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}