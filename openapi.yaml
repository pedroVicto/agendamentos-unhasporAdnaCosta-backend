openapi: 3.0.3
info:
  title: Agendamentos - Unhas por Adna Costa
  version: 1.0.0
  description: |
    API de agendamentos. A autenticação é por sessão guardada no cookie
    HttpOnly `sessao`, criado no login (staff) ou na verificação do código
    (cliente). Sem sessão válida a resposta é 401; com sessão mas papel
    errado, 403.

servers:
  - url: http://localhost:8080
    description: Local (Docker)

tags:
  - name: Público
    description: Sem login
  - name: Autenticação
    description: Entrada de cliente e staff, sessão atual e logout
  - name: Cliente
    description: Só o papel `cliente`
  - name: Supervisor
    description: Papéis `supervisor` e `admin`
  - name: Admin
    description: Só o papel `admin`

paths:
  /api/servicos:
    get:
      tags: [Público]
      summary: Lista os serviços
      operationId: listarServicos
      security: []
      responses:
        '200':
          description: Lista de serviços, ordenada por nome
          content:
            application/json:
              schema:
                type: object
                properties:
                  servicos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Servico'

  /api/servicos/{id}/horarios:
    get:
      tags: [Público]
      summary: Horários livres de um serviço num dia
      description: |
        Calculado a partir do expediente semanal, da duração do serviço, dos
        bloqueios e dos agendamentos pendentes/confirmados. É a mesma regra
        usada ao criar o agendamento: o que aparece aqui é o que é aceito.
        Não exige login (o login só é pedido na hora de agendar).
      operationId: horariosLivres
      security: []
      parameters:
        - $ref: '#/components/parameters/IdUuid'
        - name: data
          in: query
          description: Dia no formato AAAA-MM-DD. Sem ela, hoje.
          schema:
            type: string
            format: date
            example: '2026-10-20'
      responses:
        '200':
          description: Inícios livres, no fuso do salão (APP_TIMEZONE)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    format: date
                  servico_id:
                    type: string
                    format: uuid
                  duracao_minutos:
                    type: integer
                  ultimo_dia:
                    type: string
                    format: date
                    description: Último dia aceito (AGENDA_JANELA_DIAS)
                  horarios:
                    type: array
                    items:
                      type: string
                      example: '09:30'
        '400':
          description: id não é um UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Serviço inexistente ou inativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/auth/cliente/codigo:
    post:
      tags: [Autenticação]
      summary: Cliente pede o código de 6 dígitos
      description: |
        Informe `email` ou `telefone`. Sem `canal`, o código vai por e-mail
        se veio e-mail, senão por WhatsApp. A conta é criada no primeiro
        pedido. O código vale 10 minutos e aceita 5 tentativas.

        Em desenvolvimento, o e-mail aparece no Mailpit
        (http://localhost:8025); SMS/WhatsApp sem Twilio vão para o log
        (`docker compose logs -f php`).
      operationId: solicitarCodigoCliente
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome:
                  type: string
                  minLength: 2
                  maxLength: 150
                email:
                  type: string
                  format: email
                  maxLength: 150
                telefone:
                  type: string
                  description: Com DDD. Sem código de país é tratado como brasileiro.
                canal:
                  type: string
                  enum: [email, sms, whatsapp]
            examples:
              email:
                summary: Por e-mail
                value:
                  nome: Maria Silva
                  email: maria@teste.com
              whatsapp:
                summary: Por WhatsApp
                value:
                  nome: Maria Silva
                  telefone: '11999998888'
                  canal: whatsapp
              sms:
                summary: Por SMS
                value:
                  nome: Maria Silva
                  telefone: '11999998888'
                  canal: sms
      responses:
        '200':
          description: Mesma resposta tenha o código saído ou não
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                    example: Se os dados estiverem corretos, o código foi enviado.
        '422':
          description: Nome, e-mail ou telefone inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '502':
          description: Falha ao enviar o código
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/auth/cliente/verificar:
    post:
      tags: [Autenticação]
      summary: Cliente confirma o código e inicia a sessão
      description: Use o mesmo `email` ou `telefone` (e `canal`) do pedido do código.
      operationId: verificarCodigoCliente
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo]
              properties:
                email:
                  type: string
                  format: email
                telefone:
                  type: string
                canal:
                  type: string
                  enum: [email, sms, whatsapp]
                codigo:
                  type: string
                  pattern: '^\d{6}$'
            examples:
              email:
                summary: Por e-mail
                value:
                  email: maria@teste.com
                  codigo: '123456'
              telefone:
                summary: Por telefone
                value:
                  telefone: '11999998888'
                  codigo: '123456'
      responses:
        '200':
          $ref: '#/components/responses/SessaoIniciada'
        '401':
          description: Código inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/auth/staff/login:
    post:
      tags: [Autenticação]
      summary: Login de supervisor ou admin
      operationId: loginStaff
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  format: email
                senha:
                  type: string
                  format: password
            example:
              email: admin@teste.com
              senha: senha12345
      responses:
        '200':
          $ref: '#/components/responses/SessaoIniciada'
        '401':
          description: E-mail ou senha inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/auth/me:
    get:
      tags: [Autenticação]
      summary: Usuário da sessão atual
      operationId: me
      security:
        - sessao: []
      responses:
        '200':
          description: Usuário logado
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/UsuarioSessao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão
      operationId: logout
      security:
        - sessao: []
      responses:
        '204':
          description: Sessão revogada e cookie apagado
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /api/cliente/agendamentos:
    get:
      tags: [Cliente]
      summary: Agendamentos do cliente logado
      operationId: meusAgendamentos
      security:
        - sessao: []
      responses:
        '200':
          description: Agendamentos do cliente, do mais recente para o mais antigo
          content:
            application/json:
              schema:
                type: object
                properties:
                  agendamentos:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgendamentoCliente'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
    post:
      tags: [Cliente]
      summary: Pede um horário
      description: |
        O pedido nasce `pendente` e já reserva o horário até um supervisor
        responder. Dono e nome do cliente vêm da sessão. O cliente pode ter
        no máximo `AGENDA_MAX_PENDENTES` pedidos pendentes ao mesmo tempo.
        Os supervisores recebem um e-mail a cada pedido.
      operationId: criarAgendamento
      security:
        - sessao: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [servico_id, data_hora]
              properties:
                servico_id:
                  type: string
                  format: uuid
                data_hora:
                  type: string
                  description: Um dos horários de /api/servicos/{id}/horarios
                  example: '2026-10-20T14:00'
                observacoes:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Pedido criado (pendente)
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                  agendamento:
                    $ref: '#/components/schemas/AgendamentoCliente'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          description: Serviço inexistente ou inativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: O horário foi reservado por outra pessoa no mesmo instante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: Campos inválidos ou horário indisponível (fora do expediente, bloqueado, ocupado, no passado...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          description: Limite de pedidos pendentes atingido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/cliente/agendamentos/{id}/cancelar:
    patch:
      tags: [Cliente]
      summary: Cliente cancela o próprio agendamento
      description: |
        Pendente: até o horário. Confirmado: só com `AGENDA_CANCELAMENTO_HORAS`
        de antecedência. Agendamento de outro cliente responde 404.
      operationId: cancelarAgendamentoCliente
      security:
        - sessao: []
      parameters:
        - $ref: '#/components/parameters/IdUuid'
      responses:
        '200':
          $ref: '#/components/responses/AgendamentoAtualizado'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/AgendamentoNaoEncontrado'
        '409':
          $ref: '#/components/responses/TransicaoInvalida'
        '422':
          description: Já passou ou fora do prazo de cancelamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/supervisor/agendamentos:
    get:
      tags: [Supervisor]
      summary: Todos os agendamentos
      operationId: todosAgendamentos
      security:
        - sessao: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatusAgendamento'
        - name: de
          in: query
          schema:
            type: string
            format: date
        - name: ate
          in: query
          description: Inclui o dia inteiro
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Agendamentos, do mais recente para o mais antigo
          content:
            application/json:
              schema:
                type: object
                properties:
                  agendamentos:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgendamentoStaff'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '422':
          description: Filtro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/supervisor/agendamentos/{id}/confirmar:
    patch:
      tags: [Supervisor]
      summary: Aceita um pedido pendente
      description: O cliente é avisado (e-mail, ou SMS se só tiver telefone).
      operationId: confirmarAgendamento
      security:
        - sessao: []
      parameters:
        - $ref: '#/components/parameters/IdUuid'
      responses:
        '200':
          $ref: '#/components/responses/AgendamentoAtualizado'
        '404':
          $ref: '#/components/responses/AgendamentoNaoEncontrado'
        '409':
          $ref: '#/components/responses/TransicaoInvalida'
        '422':
          description: O horário já passou
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/supervisor/agendamentos/{id}/recusar:
    patch:
      tags: [Supervisor]
      summary: Recusa um pedido pendente
      description: Libera o horário. O motivo é enviado ao cliente.
      operationId: recusarAgendamento
      security:
        - sessao: []
      parameters:
        - $ref: '#/components/parameters/IdUuid'
      requestBody:
        $ref: '#/components/requestBodies/Motivo'
      responses:
        '200':
          $ref: '#/components/responses/AgendamentoAtualizado'
        '404':
          $ref: '#/components/responses/AgendamentoNaoEncontrado'
        '409':
          $ref: '#/components/responses/TransicaoInvalida'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/supervisor/agendamentos/{id}/cancelar:
    patch:
      tags: [Supervisor]
      summary: Cancela um agendamento já confirmado
      description: Libera o horário. O motivo é enviado ao cliente.
      operationId: cancelarAgendamentoSupervisor
      security:
        - sessao: []
      parameters:
        - $ref: '#/components/parameters/IdUuid'
      requestBody:
        $ref: '#/components/requestBodies/Motivo'
      responses:
        '200':
          $ref: '#/components/responses/AgendamentoAtualizado'
        '404':
          $ref: '#/components/responses/AgendamentoNaoEncontrado'
        '409':
          $ref: '#/components/responses/TransicaoInvalida'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/supervisor/expediente:
    get:
      tags: [Supervisor]
      summary: Expediente semanal
      operationId: listarExpediente
      security:
        - sessao: []
      responses:
        '200':
          $ref: '#/components/responses/Expediente'
    put:
      tags: [Supervisor]
      summary: Substitui o expediente da semana inteira
      description: |
        Um dia pode ter várias faixas (ex.: deixar o almoço de fora). Dia sem
        faixa é dia fechado. Agendamentos já feitos não são alterados.
      operationId: substituirExpediente
      security:
        - sessao: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [faixas]
              properties:
                faixas:
                  type: array
                  items:
                    $ref: '#/components/schemas/FaixaExpediente'
            example:
              faixas:
                - {dia_semana: 2, inicio: '09:00', fim: '12:00'}
                - {dia_semana: 2, inicio: '13:00', fim: '18:00'}
      responses:
        '200':
          $ref: '#/components/responses/Expediente'
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/supervisor/bloqueios:
    get:
      tags: [Supervisor]
      summary: Lista bloqueios da agenda
      description: Sem filtro, de hoje em diante.
      operationId: listarBloqueios
      security:
        - sessao: []
      parameters:
        - name: de
          in: query
          schema:
            type: string
            format: date
        - name: ate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Bloqueios ordenados pelo início
          content:
            application/json:
              schema:
                type: object
                properties:
                  bloqueios:
                    type: array
                    items:
                      $ref: '#/components/schemas/Bloqueio'
    post:
      tags: [Supervisor]
      summary: Bloqueia um período (imprevisto, folga, feriado...)
      description: |
        Se já houver agendamento pendente/confirmado no período, responde 409
        com a lista: recuse ou cancele cada um antes (o cliente é avisado).
      operationId: criarBloqueio
      security:
        - sessao: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inicio, fim, motivo]
              properties:
                inicio:
                  type: string
                  example: '2026-10-20T14:00'
                fim:
                  type: string
                  example: '2026-10-20T15:00'
                motivo:
                  type: string
                  maxLength: 150
                  example: imprevisto
      responses:
        '201':
          description: Bloqueio criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  bloqueio:
                    $ref: '#/components/schemas/Bloqueio'
        '409':
          description: Há agendamentos no período
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                  agendamentos:
                    type: array
                    items:
                      type: object
        '422':
          $ref: '#/components/responses/DadosInvalidos'

  /api/supervisor/bloqueios/{id}:
    delete:
      tags: [Supervisor]
      summary: Remove um bloqueio
      operationId: removerBloqueio
      security:
        - sessao: []
      parameters:
        - $ref: '#/components/parameters/IdUuid'
      responses:
        '204':
          description: Removido
        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/admin/usuarios:
    get:
      tags: [Admin]
      summary: Lista supervisores e admins
      operationId: listarUsuarios
      security:
        - sessao: []
      responses:
        '200':
          description: Usuários de staff, ordenados por nome
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsuarioStaff'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
    post:
      tags: [Admin]
      summary: Cria um supervisor
      operationId: criarSupervisor
      security:
        - sessao: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, senha]
              properties:
                nome:
                  type: string
                  maxLength: 150
                email:
                  type: string
                  format: email
                  maxLength: 150
                senha:
                  type: string
                  format: password
                  minLength: 10
            example:
              nome: Supervisora Teste
              email: sup@teste.com
              senha: senha12345
      responses:
        '201':
          description: Supervisor criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  usuario:
                    $ref: '#/components/schemas/UsuarioSessao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '409':
          description: Já existe um usuário com este e-mail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: Nome, e-mail ou senha inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /api/admin/usuarios/{id}/ativo:
    patch:
      tags: [Admin]
      summary: Ativa ou desativa um supervisor
      description: Desativar também revoga todas as sessões do supervisor.
      operationId: definirAtivo
      security:
        - sessao: []
      parameters:
        - $ref: '#/components/parameters/IdUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ativo]
              properties:
                ativo:
                  type: boolean
            example:
              ativo: false
      responses:
        '204':
          description: Atualizado
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          description: Supervisor não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '400':
          description: '`id` não é um UUID válido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: '`ativo` não é booleano'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

components:
  securitySchemes:
    sessao:
      type: apiKey
      in: cookie
      name: sessao
      description: Cookie HttpOnly criado no login. Cliente dura 30 dias; staff, 8 horas.

  parameters:
    IdUuid:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  requestBodies:
    Motivo:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [motivo]
            properties:
              motivo:
                type: string
                maxLength: 255
                description: Enviado ao cliente

  responses:
    DadosInvalidos:
      description: Campos inválidos
      content:
        application/json:
          schema:
            type: object
            properties:
              erro:
                type: string
              campos:
                type: object
                additionalProperties:
                  type: string
    AgendamentoAtualizado:
      description: Agendamento com o novo status
      content:
        application/json:
          schema:
            type: object
            properties:
              agendamento:
                $ref: '#/components/schemas/AgendamentoCliente'
    AgendamentoNaoEncontrado:
      description: Não existe (ou não é seu)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    TransicaoInvalida:
      description: 'O status atual não permite a ação (ex.: já confirmado por outro supervisor)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Expediente:
      description: Faixas da semana
      content:
        application/json:
          schema:
            type: object
            properties:
              faixas:
                type: array
                items:
                  $ref: '#/components/schemas/FaixaExpediente'
    SessaoIniciada:
      description: Sessão criada; o token vem no cookie `sessao`
      headers:
        Set-Cookie:
          schema:
            type: string
            example: sessao=abc123...; Path=/; HttpOnly; SameSite=Lax
      content:
        application/json:
          schema:
            type: object
            properties:
              usuario:
                $ref: '#/components/schemas/UsuarioSessao'
    NaoAutenticado:
      description: Sem sessão válida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: Não autenticado.
    AcessoNegado:
      description: Sessão válida, mas o papel não tem acesso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            erro: Acesso negado.

  schemas:
    Erro:
      type: object
      properties:
        erro:
          type: string

    Papel:
      type: string
      enum: [cliente, supervisor, admin]

    UsuarioSessao:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        papel:
          $ref: '#/components/schemas/Papel'

    UsuarioStaff:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        email:
          type: string
          format: email
        papel:
          $ref: '#/components/schemas/Papel'
        ativo:
          type: boolean
        created_at:
          type: string
          example: '2026-10-08 15:00:00'

    Servico:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        preco:
          type: number
          example: 45.0
        descricao:
          type: string
          nullable: true
        duracao_minutos:
          type: integer
          description: Entre 15 e 480, múltiplo de 5. Opcional ao criar (padrão 60).
          example: 60

    AgendamentoCliente:
      type: object
      properties:
        id:
          type: string
          format: uuid
        data_hora:
          type: string
          example: '2026-10-20 14:00:00'
        data_hora_fim:
          type: string
          example: '2026-10-20 15:00:00'
        status:
          $ref: '#/components/schemas/StatusAgendamento'
        motivo:
          type: string
          nullable: true
          description: Motivo da recusa ou do cancelamento
        observacoes:
          type: string
          nullable: true
        servico_id:
          type: string
          format: uuid
        servico:
          type: string
          description: Nome do serviço
        preco:
          type: number
          example: 45.0

    AgendamentoStaff:
      allOf:
        - $ref: '#/components/schemas/AgendamentoCliente'
        - type: object
          properties:
            nome_cliente:
              type: string
            usuario_id:
              type: string
              format: uuid
              nullable: true
            email_cliente:
              type: string
              nullable: true
            telefone_cliente:
              type: string
              nullable: true
            cancelado_por:
              type: string
              enum: [cliente, supervisor]
              nullable: true
            respondido_por:
              type: string
              nullable: true
              description: Nome de quem confirmou/recusou/cancelou
            respondido_em:
              type: string
              nullable: true
            created_at:
              type: string

    StatusAgendamento:
      type: string
      description: pendente e confirmado ocupam o horário; recusado e cancelado o liberam
      enum: [pendente, confirmado, recusado, cancelado]

    FaixaExpediente:
      type: object
      required: [dia_semana, inicio, fim]
      properties:
        dia_semana:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = domingo ... 6 = sábado
        inicio:
          type: string
          example: '09:00'
        fim:
          type: string
          example: '18:00'

    Bloqueio:
      type: object
      properties:
        id:
          type: string
          format: uuid
        inicio:
          type: string
          example: '2026-10-20 14:00:00'
        fim:
          type: string
          example: '2026-10-20 15:00:00'
        motivo:
          type: string
        criado_por:
          type: string
          nullable: true
        created_at:
          type: string
